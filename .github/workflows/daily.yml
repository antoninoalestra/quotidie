name: Edizione del mattino

# Ogni mattina chiede a Gemini notizie e lezione del giorno e le salva in data/.
# La API key è letta dal secret GEMINI_API_KEY e non lascia mai GitHub.

on:
  schedule:
    # 05:30 UTC = 06:30 (ora solare) / 07:30 (ora legale) in Italia.
    # I job programmati di GitHub possono partire in ritardo: così è tutto pronto prima delle 9.
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Cosa generare"
        type: choice
        options: [tutto, news, lesson]
        default: tutto
      force:
        description: "Rigenera la lezione anche se esiste già"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepara il generatore
        run: |
          mkdir -p "$RUNNER_TEMP/gen"
          cat > "$RUNNER_TEMP/gen/generate.mjs" <<'GENERATOR'
          import { readFile, writeFile, mkdir, readdir, unlink } from 'node:fs/promises';
          import { existsSync } from 'node:fs';
          import path from 'node:path';

          const DATA = path.resolve('data');
          const API_KEY = process.env.GEMINI_API_KEY;
          const MODEL = process.env.GEMINI_MODEL || 'gemini-3.8-flash';
          const TZ = 'Europe/Rome';
          const ONLY = ['news', 'lesson'].includes(process.env.ONLY) ? process.env.ONLY : null;
          const FORCE = process.env.FORCE === 'true';

          // Lettura da 5-6 minuti a ~200 parole/minuto
          const LIMITS = { news: { min: 850, max: 1250 }, lesson: { min: 850, max: 1250 } };
          const KEEP_NEWS_DAYS = 7;
          const AVOID_RECENT_CATEGORIES = 8;

          // Stesse categorie predefinite di app.js
          const DEFAULT_TOPICS = [
            'Intelligenza artificiale', 'Informatica', 'Architettura software', 'Cybersecurity', 'Finanza personale',
            'Mercati finanziari', 'Macroeconomia', 'Economia comportamentale', 'Storia', "Storia dell'arte", 'Filosofia',
            'Psicologia', 'Neuroscienze', 'Fisica', 'Astronomia', 'Biologia', 'Medicina e salute', 'Chimica', 'Matematica',
            'Geopolitica', 'Linguistica ed etimologia', 'Letteratura', 'Musica', 'Design', 'Architettura', 'Cinema',
            'Gastronomia e vino', 'Produttività e metodo', 'Negoziazione e comunicazione', 'Retorica e pensiero critico',
            'Grandi invenzioni', 'Ecologia e clima', 'Diritto per tutti', 'Mitologia',
          ];
          const slug = (name) => name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

          if (!API_KEY) {
            console.error('Manca il secret GEMINI_API_KEY: aggiungilo in Settings → Secrets and variables → Actions.');
            process.exit(1);
          }

          /* ---------- Utilità ---------- */
          const today = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
          const todayLong = new Intl.DateTimeFormat('it-IT', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date());

          const words = (s) => (String(s ?? '').match(/\S+/g) || []).length;
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const readJSON = async (p, fallback) => {
            try { return JSON.parse(await readFile(p, 'utf8')); } catch { return fallback; }
          };
          const writeJSON = async (p, data) => {
            await mkdir(path.dirname(p), { recursive: true });
            await writeFile(p, JSON.stringify(data, null, 2) + '\n', 'utf8');
          };
          const log = (...m) => console.log(`[${new Date().toISOString().slice(11, 19)}]`, ...m);

          /* ---------- Gemini ---------- */
          async function gemini({ prompt, system, schema, search = false, temperature = 0.7 }) {
            const body = {
              contents: [{ role: 'user', parts: [{ text: prompt }] }],
              generationConfig: { temperature },
            };
            if (system) body.systemInstruction = { parts: [{ text: system }] };
            if (search) body.tools = [{ google_search: {} }];
            if (schema) {
              body.generationConfig.responseMimeType = 'application/json';
              body.generationConfig.responseJsonSchema = schema;
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;
            for (let attempt = 1; attempt <= 5; attempt++) {
              const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-goog-api-key': API_KEY },
                body: JSON.stringify(body),
              });
              if (res.ok) {
                const data = await res.json();
                const cand = data.candidates?.[0];
                const text = cand?.content?.parts?.map((p) => p.text || '').join('') ?? '';
                if (!text) throw new Error(`Risposta vuota (finishReason: ${cand?.finishReason})`);
                return { text, grounding: cand.groundingMetadata };
              }
              const errText = await res.text();
              if (res.status === 404) throw new Error(`Modello "${MODEL}" non trovato: imposta la variabile GEMINI_MODEL con un modello disponibile. ${errText.slice(0, 300)}`);
              if ([429, 500, 502, 503, 504].includes(res.status) && attempt < 5) {
                const wait = 2 ** attempt * 3000;
                log(`Gemini ${res.status}, nuovo tentativo tra ${wait / 1000}s`);
                await sleep(wait);
                continue;
              }
              throw new Error(`Gemini ${res.status}: ${errText.slice(0, 500)}`);
            }
          }

          const parseJSON = (text) => JSON.parse(text.trim().replace(/^```(?:json)?\s*|\s*```$/g, ''));

          /* ---------- Notizie ---------- */
          const NEWS_DESKS = [
            { id: 'tech', title: 'Tecnologia e AI', count: 4, focus: 'intelligenza artificiale, big tech, startup, semiconduttori, ricerca, regolamentazione tech' },
            { id: 'finance', title: 'Finanza e mercati', count: 3, focus: 'mercati azionari e obbligazionari, banche centrali, tassi, materie prime, crypto rilevanti, risultati societari importanti' },
            { id: 'italy', title: 'Italia', count: 3, focus: 'politica, economia e società italiana' },
            { id: 'world', title: 'Mondo', count: 3, focus: 'esteri, geopolitica, grandi eventi internazionali' },
          ];

          const NEWS_SCHEMA = {
            type: 'object',
            properties: {
              brief: { type: 'array', items: { type: 'string' } },
              sections: {
                type: 'array',
                items: {
                  type: 'object',
                  properties: {
                    id: { type: 'string', enum: NEWS_DESKS.map((d) => d.id) },
                    stories: {
                      type: 'array',
                      items: {
                        type: 'object',
                        properties: {
                          title: { type: 'string' },
                          summary: { type: 'string' },
                          why: { type: 'string' },
                          sourceUrls: { type: 'array', items: { type: 'string' } },
                        },
                        required: ['title', 'summary', 'why', 'sourceUrls'],
                      },
                    },
                  },
                  required: ['id', 'stories'],
                },
              },
            },
            required: ['brief', 'sections'],
          };

          // Le fonti del grounding hanno URL di redirect: il "title" contiene il dominio vero
          function prettySource(title, url) {
            if (title && /\.[a-z]{2,}$/i.test(title.trim())) return title.trim().replace(/^www\./, '');
            try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return 'Fonte'; }
          }

          async function generateNews() {
            log('Notizie: ricerca con Google Search');
            const deskList = NEWS_DESKS.map((d) => `- ${d.title} (${d.count} notizie): ${d.focus}`).join('\n');

            const research = await gemini({
              search: true,
              temperature: 0.3,
              system: 'Sei il caporedattore di un quotidiano italiano di qualità. Lavori solo su fatti verificati e recenti, citando le fonti. Non inventi nulla.',
              prompt: `Oggi è ${todayLong}. Cerca le notizie più importanti delle ultime 24-36 ore per queste sezioni:
          ${deskList}

          Per ogni notizia riporta: i fatti essenziali (chi, cosa, quando, numeri chiave), il contesto e perché è rilevante. Preferisci fonti autorevoli (agenzie, quotidiani nazionali e internazionali, testate di settore). Scarta gossip e notizie minori. Evita doppioni tra le sezioni.`,
            });

            const chunks = (research.grounding?.groundingChunks || []).map((c) => c.web).filter((w) => w?.uri);
            log(`Notizie: ${chunks.length} fonti trovate`);
            const sourceList = chunks.map((c, i) => `[${i}] ${c.title || ''} ${c.uri}`).join('\n');

            for (let attempt = 1; attempt <= 3; attempt++) {
              const { text } = await gemini({
                schema: NEWS_SCHEMA,
                temperature: 0.4,
                system: 'Sei un redattore italiano: scrivi in un italiano chiaro, preciso e sobrio, da quotidiano di qualità. Niente sensazionalismo, niente emoji.',
                prompt: `Trasforma questa rassegna in un giornale del mattino in italiano.

          RASSEGNA:
          ${research.text}

          FONTI DISPONIBILI:
          ${sourceList || '(nessuna)'}

          REGOLE:
          - Sezioni e numero di notizie: ${NEWS_DESKS.map((d) => `${d.id}=${d.count}`).join(', ')}.
          - "brief": esattamente 3 frasi, una per ciascuno dei fatti più importanti di oggi (max 30 parole l'una).
          - "title": titolo informativo, max 12 parole, senza punto finale.
          - "summary": 55-75 parole, solo fatti e contesto.
          - "why": una frase (max 25 parole) che spiega perché la notizia conta.
          - "sourceUrls": 1-2 URL presi SOLO dall'elenco FONTI DISPONIBILI, quelli che supportano la notizia. Lista vuota se nessuno è pertinente.
          - Lunghezza totale tra ${LIMITS.news.min} e ${LIMITS.news.max - 100} parole: deve leggersi in 5 minuti.
          - Usa solo informazioni presenti nella rassegna.`,
              });

              const draft = parseJSON(text);
              const titles = new Map(chunks.map((c) => [c.uri, c.title]));
              const sections = NEWS_DESKS.map((desk) => {
                const s = draft.sections.find((x) => x.id === desk.id) || { stories: [] };
                return {
                  id: desk.id,
                  title: desk.title,
                  stories: s.stories.slice(0, desk.count).map((st) => ({
                    title: st.title.trim(),
                    summary: st.summary.trim(),
                    why: st.why.trim(),
                    sources: [...new Set(st.sourceUrls || [])]
                      .filter((u) => /^https?:\/\//.test(u))
                      .slice(0, 2)
                      .map((u) => ({ url: u, title: prettySource(titles.get(u), u) })),
                  })),
                };
              }).filter((s) => s.stories.length);

              const news = { date: today, generatedAt: new Date().toISOString(), model: MODEL, brief: draft.brief.slice(0, 3), sections };
              const total = words([news.brief.join(' '), ...sections.flatMap((s) => s.stories.flatMap((x) => [x.title, x.summary, x.why]))].join(' '));
              log(`Notizie: ${total} parole (tentativo ${attempt})`);
              if (total <= LIMITS.news.max && sections.length >= 3) return news;
            }
            throw new Error('Notizie troppo lunghe o incomplete dopo 3 tentativi');
          }

          /* ---------- Lezione ---------- */
          const LESSON_SCHEMA = {
            type: 'object',
            properties: {
              title: { type: 'string' },
              hook: { type: 'string' },
              sections: {
                type: 'array',
                items: {
                  type: 'object',
                  properties: { heading: { type: 'string' }, body: { type: 'string' } },
                  required: ['heading', 'body'],
                },
              },
              example: { type: 'string' },
              keyTakeaways: { type: 'array', items: { type: 'string' } },
              funFact: { type: 'string' },
              furtherReading: {
                type: 'array',
                items: {
                  type: 'object',
                  properties: { title: { type: 'string' }, note: { type: 'string' } },
                  required: ['title'],
                },
              },
            },
            required: ['title', 'hook', 'sections', 'example', 'keyTakeaways', 'funFact', 'furtherReading'],
          };

          function pickCategory(topics, index) {
            const enabled = topics.categories.filter((c) => c.enabled);
            if (!enabled.length) throw new Error('Nessuna categoria attiva in data/topics.json');
            const recent = index.slice(0, AVOID_RECENT_CATEGORIES).map((l) => l.categoryId);
            const counts = Object.fromEntries(enabled.map((c) => [c.id, index.filter((l) => l.categoryId === c.id).length]));
            let pool = enabled.filter((c) => !recent.includes(c.id));
            if (!pool.length) pool = enabled;
            // Favorisce le categorie meno trattate finora
            const min = Math.min(...pool.map((c) => counts[c.id]));
            const least = pool.filter((c) => counts[c.id] <= min + 1);
            return least[Math.floor(Math.random() * least.length)];
          }

          async function generateLesson(topics, index) {
            const category = pickCategory(topics, index);
            const past = index.map((l) => l.title);
            const pastSame = index.filter((l) => l.categoryId === category.id).map((l) => l.title);
            log(`Lezione: categoria "${category.name}"`);

            // 1) Scelta di un argomento specifico e nuovo
            const { text: topicText } = await gemini({
              temperature: 1,
              schema: {
                type: 'object',
                properties: { topic: { type: 'string' }, angle: { type: 'string' } },
                required: ['topic', 'angle'],
              },
              prompt: `Proponi UN argomento per una lezione di microlearning di 5 minuti nella categoria "${category.name}".
          Deve essere specifico (non "la storia di Roma" ma "perché i Romani usavano il calcestruzzo pozzolanico e come si autoripara"), sorprendente, utile o affascinante per un adulto curioso e colto.
          Spazia tra livelli: concetti fondamentali, idee controintuitive, storie poco note, strumenti pratici.
          Argomenti GIÀ trattati in questa categoria, da NON ripetere né sovrapporre:
          ${pastSame.length ? pastSame.map((t) => `- ${t}`).join('\n') : '(nessuno)'}
          Altri titoli già usati: ${past.slice(0, 120).join(' | ') || '(nessuno)'}
          Restituisci "topic" (l'argomento) e "angle" (l'angolazione narrativa, una frase).`,
            });
            const { topic, angle } = parseJSON(topicText);
            log(`Lezione: "${topic}"`);

            // 2) Scrittura della lezione
            for (let attempt = 1; attempt <= 3; attempt++) {
              const { text } = await gemini({
                schema: LESSON_SCHEMA,
                temperature: 0.8,
                system: 'Sei un divulgatore italiano eccellente, nello stile dei migliori saggisti: chiaro, preciso, narrativo, mai banale. Scrivi in italiano. Niente emoji, niente elenchi puntati nel corpo del testo.',
                prompt: `Scrivi una lezione di microlearning.
          Categoria: ${category.name}
          Argomento: ${topic}
          Angolazione: ${angle}

          STRUTTURA:
          - "title": titolo evocativo e chiaro, max 10 parole.
          - "hook": 1-2 frasi che incuriosiscono e pongono la domanda centrale.
          - "sections": 3 o 4 sezioni con "heading" breve e "body" di 1-3 paragrafi separati da una riga vuota. Parti dall'intuizione, poi spiega il meccanismo, poi le implicazioni. Puoi usare **grassetto** per i termini chiave.
          - "example": un esempio concreto o un caso reale (60-100 parole).
          - "keyTakeaways": esattamente 3 frasi da ricordare.
          - "funFact": una curiosità vera e verificabile (max 50 parole).
          - "furtherReading": 1-2 libri o risorse reali e esistenti, con "note" di una riga.

          VINCOLI:
          - Lunghezza totale tra ${LIMITS.lesson.min} e ${LIMITS.lesson.max - 150} parole: deve leggersi in 5 minuti.
          - Accuratezza assoluta: se un dato è incerto, non citarlo.`,
              });
              const draft = parseJSON(text);
              const total = words([draft.hook, ...draft.sections.flatMap((s) => [s.heading, s.body]), draft.example, ...draft.keyTakeaways, draft.funFact].join(' '));
              log(`Lezione: ${total} parole (tentativo ${attempt})`);
              if (total <= LIMITS.lesson.max && total >= LIMITS.lesson.min * 0.75) {
                return {
                  date: today,
                  generatedAt: new Date().toISOString(),
                  model: MODEL,
                  category: category.name,
                  categoryId: category.id,
                  minutes: Math.max(1, Math.round(total / 200)),
                  words: total,
                  title: draft.title.trim(),
                  hook: draft.hook.trim(),
                  sections: draft.sections,
                  example: draft.example,
                  keyTakeaways: draft.keyTakeaways.slice(0, 3),
                  funFact: draft.funFact,
                  furtherReading: draft.furtherReading.slice(0, 2),
                };
              }
            }
            throw new Error('Lezione fuori dai limiti di lunghezza dopo 3 tentativi');
          }

          /* ---------- Main ---------- */
          async function main() {
            log(`Edizione del ${today} con ${MODEL}`);
            let failed = false;

            if (!ONLY || ONLY === 'news') {
              try {
                const news = await generateNews();
                await writeJSON(path.join(DATA, 'news', 'latest.json'), news);
                await writeJSON(path.join(DATA, 'news', `${today}.json`), news);
                const files = (await readdir(path.join(DATA, 'news'))).filter((f) => /^\d{4}-\d{2}-\d{2}\.json$/.test(f)).sort();
                for (const f of files.slice(0, Math.max(0, files.length - KEEP_NEWS_DAYS))) await unlink(path.join(DATA, 'news', f));
                log('Notizie salvate');
              } catch (err) {
                failed = true;
                console.error('Errore notizie:', err.message);
              }
            }

            if (!ONLY || ONLY === 'lesson') {
              try {
                const topicsPath = path.join(DATA, 'topics.json');
                let topics = await readJSON(topicsPath, null);
                if (!topics?.categories?.length) {
                  topics = { updatedAt: today, categories: DEFAULT_TOPICS.map((name) => ({ id: slug(name), name, enabled: true })) };
                  await writeJSON(topicsPath, topics);
                  log('Creato data/topics.json con le categorie predefinite');
                }
                const indexPath = path.join(DATA, 'lessons', 'index.json');
                const lessonPath = path.join(DATA, 'lessons', `${today}.json`);
                const idx = await readJSON(indexPath, { lessons: [] });
                if (existsSync(lessonPath) && !FORCE) {
                  log('Lezione di oggi già presente (scegli "Rigenera la lezione" per crearne una nuova)');
                } else {
                  const others = idx.lessons.filter((l) => l.date !== today);
                  const lesson = await generateLesson(topics, others);
                  await writeJSON(lessonPath, lesson);
                  idx.lessons = [
                    { date: today, title: lesson.title, category: lesson.category, categoryId: lesson.categoryId, minutes: lesson.minutes, hook: lesson.hook },
                    ...others,
                  ].sort((a, b) => b.date.localeCompare(a.date));
                  await writeJSON(indexPath, idx);
                  log('Lezione salvata');
                }
              } catch (err) {
                failed = true;
                console.error('Errore lezione:', err.message);
              }
            }

            if (failed) process.exit(1);
          }

          main();
          GENERATOR

      - name: Genera notizie e lezione
        id: gen
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: node "$RUNNER_TEMP/gen/generate.mjs"

      - name: Salva i contenuti nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d data ]; then echo "Nessun contenuto generato"; exit 0; fi
          git add data
          if git diff --staged --quiet; then
            echo "Nessun contenuto nuovo"
          else
            git commit -m "Edizione del $(TZ=Europe/Rome date +%F)"
            git pull --rebase
            git push
          fi

      - name: Segnala errori di generazione
        if: steps.gen.outcome == 'failure'
        run: |
          echo "::error::La generazione non è riuscita del tutto: apri il log dello step 'Genera notizie e lezione' per il dettaglio."
          exit 1
