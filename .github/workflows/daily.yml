name: Edizione del mattino

# Ogni mattina chiede a Gemini il giornale e la lezione del giorno e li salva in data/.
# La API key è letta dal secret GEMINI_API_KEY e non lascia mai GitHub.
#
# IMPORTANTE: questo file funziona solo se nel repository si trova esattamente in
#   .github/workflows/daily.yml
# Con un altro nome o in un'altra cartella GitHub lo ignora: niente avvio automatico
# e niente pulsante "Run workflow".

run-name: ${{ (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && 'Edizione automatica' || format('Edizione manuale ({0})', inputs.only || github.event.client_payload.only || 'tutto') }}

on:
  schedule:
    # Orari UTC scaglionati nella notte a minuti non congestionati.
    # Il generatore è idempotente: se l'edizione di oggi esiste già, salta in 5 secondi.
    # 23:17 UTC = 00:17 ora solare italiana (subito dopo mezzanotte, assorbe i ritardi di 5-7h di GitHub)
    # 01:23 UTC = 02:23 ora solare italiana
    # 03:07 UTC = 04:07 ora solare italiana
    # 04:41 UTC = 05:41 ora solare italiana (riserva prima delle 6:30)
    - cron: "17 23 * * *"
    - cron: "23 1 * * *"
    - cron: "7 3 * * *"
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Cosa generare"
        type: choice
        options: [tutto, news, lesson]
        default: tutto
      force:
        description: "Sostituisci la lezione di oggi se esiste già"
        type: boolean
        default: false
      new_series:
        description: "Inizia un nuovo percorso di più lezioni"
        type: boolean
        default: false
      test_open_source:
        description: "Prova la voce open source (lenta, 20-40 minuti)"
        type: boolean
        default: false
  repository_dispatch:
    types: [daily, tutto, news, lesson]

permissions:
  contents: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepara Python per sintesi vocale neurale
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa edge-tts
        run: pip install --upgrade edge-tts

      # ===== QUOTIDIE AUDIO v2: voce open source (solo avvio programmato o test) =====
      - name: Strumenti audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -version | head -n 1

      - name: Cache motore voce open source
        if: (vars.AUDIO_ENGINE != 'edge' && vars.AUDIO_ENGINE != 'edge-tts') && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || inputs.test_open_source == true)
        id: qwen-cache
        uses: actions/cache@v4
        with:
          path: ~/qwen3-tts
          key: qwen3-tts-v1-${{ runner.os }}

      - name: Installa motore voce open source (Qwen3-TTS)
        if: (vars.AUDIO_ENGINE != 'edge' && vars.AUDIO_ENGINE != 'edge-tts') && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || inputs.test_open_source == true) && steps.qwen-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          sudo apt-get install -y -qq build-essential libopenblas-dev > /dev/null
          (
            set -e
            rm -rf ~/qwen3-tts
            git clone --depth 1 https://github.com/gabriele-mastrapasqua/qwen3-tts.git ~/qwen3-tts
            cd ~/qwen3-tts
            make blas SIMD=portable
            ./download_model.sh --model small
            ls -lh qwen3-tts-0.6b
          ) || { echo "Installazione non riuscita: si userà edge-tts"; rm -rf ~/qwen3-tts; exit 1; }

      - name: Verifica motore voce open source
        if: (vars.AUDIO_ENGINE != 'edge' && vars.AUDIO_ENGINE != 'edge-tts') && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || inputs.test_open_source == true)
        id: qwen-check
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq libopenblas0 > /dev/null || true
          cd ~/qwen3-tts
          ./qwen_tts --self-test
          ./qwen_tts -d qwen3-tts-0.6b -s "${QWEN_SPEAKER:-ryan}" -l Italian --int4 --silent --text "Buongiorno, questa è una prova." -o "$RUNNER_TEMP/prova.wav"
          test -s "$RUNNER_TEMP/prova.wav"
          echo "bin=$HOME/qwen3-tts/qwen_tts" >> "$GITHUB_OUTPUT"
          echo "model=$HOME/qwen3-tts/qwen3-tts-0.6b" >> "$GITHUB_OUTPUT"
        env:
          QWEN_SPEAKER: ${{ vars.QWEN_SPEAKER }}
      # ===== FINE QUOTIDIE AUDIO v2 =====

      - name: Prepara il generatore
        run: |
          mkdir -p "$RUNNER_TEMP/gen"
          cat > "$RUNNER_TEMP/gen/generate.mjs" <<'GENERATOR'
          import { readFile, writeFile, mkdir, readdir, unlink, appendFile } from 'node:fs/promises';
          import { existsSync } from 'node:fs';
          import path from 'node:path';
          import { execFile } from 'node:child_process';
          import { promisify } from 'node:util';
          import { mkdtemp as qdMkdtemp, copyFile as qdCopyFile, rm as qdRm } from 'node:fs/promises';
          import { spawn as qdSpawn } from 'node:child_process';
          import qdOs from 'node:os';
          import { spawn as qdEnSpawn } from 'node:child_process';
          import { rm as qdEnRm } from 'node:fs/promises';

          const pExec = promisify(execFile);
          const AUDIO_DIR = path.resolve('data', 'audio');
          const VOICE = process.env.EDGE_VOICE || 'it-IT-GiuseppeMultilingualNeural';

          const DATA = path.resolve('data');
          const API_KEY = (process.env.GEMINI_API_KEY || '').trim();
          const API_BASE = process.env.GEMINI_API_BASE || 'https://generativelanguage.googleapis.com/v1beta';
          const TZ = 'Europe/Rome';
          const ONLY = ['news', 'lesson'].includes(process.env.ONLY) ? process.env.ONLY : null;
          const FORCE = process.env.FORCE === 'true';
          const NEW_SERIES = process.env.NEW_SERIES === 'true';
          const SCHEDULED = process.env.EVENT === 'schedule';

          // Giornale da ~10 minuti, lezione da ~5 minuti (circa 200 parole al minuto)
          const WPM = 200;
          const LIMITS = { news: { target: '1800-2100', min: 1500, max: 2300 }, lesson: { min: 650, max: 1250 } };
          const MIN_STORIES = 10;          // su 13 previste: sotto questa soglia si riprova
          const KEEP_NEWS_DAYS = 8;        // archivio sfogliabile nell'app
          const AVOID_RECENT_CATEGORIES = 8;
          const SERIES = { minGap: 14, maxGap: 21, chance: 0.35, minLessons: 7 }; // un percorso ogni 2-3 settimane

          // Stesse categorie predefinite di app.js
          const DEFAULT_TOPICS = [
            'Intelligenza artificiale', 'Informatica', 'Architettura software', 'Cybersecurity', 'Finanza personale',
            'Mercati finanziari', 'Macroeconomia', 'Economia comportamentale', 'Storia', "Storia dell'arte", 'Filosofia',
            'Psicologia', 'Neuroscienze', 'Fisica', 'Astronomia', 'Biologia', 'Medicina e salute', 'Chimica', 'Matematica',
            'Geopolitica', 'Linguistica ed etimologia', 'Letteratura', 'Musica', 'Design', 'Architettura', 'Cinema',
            'Gastronomia e vino', 'Produttività e metodo', 'Negoziazione e comunicazione', 'Retorica e pensiero critico',
            'Grandi invenzioni', 'Ecologia e clima', 'Diritto per tutti', 'Mitologia',
          ];
          const slug = (name) => String(name).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

          if (!API_KEY) {
            console.error('Manca il secret GEMINI_API_KEY: aggiungilo in Settings → Secrets and variables → Actions.');
            process.exit(1);
          }

          /* ---------- Date (sempre ora di Roma) ---------- */
          const today = process.env.QD_TODAY || new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
          const fromIso = (iso) => new Date(`${iso}T12:00:00Z`);
          const addDays = (iso, n) => { const d = fromIso(iso); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
          const daysBetween = (a, b) => Math.round((fromIso(b) - fromIso(a)) / 86400000);
          const longDate = (iso) => new Intl.DateTimeFormat('it-IT', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(fromIso(iso));
          const shortDate = (iso) => new Intl.DateTimeFormat('it-IT', { timeZone: 'UTC', day: 'numeric', month: 'long' }).format(fromIso(iso));
          const IS_SUNDAY = fromIso(today).getUTCDay() === 0;

          /* ---------- Utilità ---------- */
          const words = (s) => (String(s ?? '').match(/\S+/g) || []).length;
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const str = (v) => (typeof v === 'string' ? v.trim() : '');
          const arr = (v) => (Array.isArray(v) ? v : []);
          const readJSON = async (p, fallback) => {
            try { return JSON.parse(await readFile(p, 'utf8')); } catch { return fallback; }
          };
          const writeJSON = async (p, data) => {
            await mkdir(path.dirname(p), { recursive: true });
            await writeFile(p, JSON.stringify(data, null, 2) + '\n', 'utf8');
          };
          const log = (...m) => console.log(`[${new Date().toISOString().slice(11, 19)}]`, ...m);
          const report = [];
          const note = (line) => { report.push(line); log(line); };

          async function mapLimit(items, limit, fn) {
            const out = new Array(items.length);
            let next = 0;
            const worker = async () => { while (next < items.length) { const i = next++; out[i] = await fn(items[i], i); } };
            await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
            return out;
          }

          /* ===================== QUOTIDIE AUDIO v2 — INIZIO =====================
             Audio del giornale e della lezione.
             - Avvio programmato (EVENT=schedule) o test (TEST_OPEN_SOURCE=true):
                 voce open source Qwen3-TTS; se fallisce o è troppo lenta → edge-tts.
             - Avvio manuale: solo edge-tts (veloce).
             In tutti i casi il testo viene prima riscritto per l'ascolto (copione).
             Richiede nel generatore: gemini(), parseJSON(), log(), note(), readJSON(),
             writeJSON(), today, DATA, formatNewsSpeech(), formatLessonSpeech(),
             e gli import qdSpawn, qdMkdtemp, qdCopyFile, qdRm, qdOs (vedi istruzioni).
             ===================================================================== */
          const isEdgeMode = (process.env.AUDIO_ENGINE || '').trim().toLowerCase() === 'edge' ||
            (process.env.AUDIO_ENGINE || '').trim().toLowerCase() === 'edge-tts' ||
            (process.env.QWEN_SPEAKER || '').trim().toLowerCase() === 'giuseppe';

          const AUDIO = {
            dir: path.resolve('data', 'audio'),
            qwenBin: process.env.QWEN_BIN || '',
            qwenModel: process.env.QWEN_MODEL_DIR || '',
            qwenSpeakerNews: (process.env.QWEN_SPEAKER || '').trim() || 'ryan',
            qwenSpeakerLesson: (process.env.QWEN_SPEAKER_LESSON || '').trim() || (process.env.QWEN_SPEAKER || '').trim() || 'ryan',
            edgeVoice: (process.env.EDGE_VOICE || '').trim() || 'it-IT-GiuseppeMultilingualNeural',
            useOpenSource: !isEdgeMode && (process.env.EVENT === 'schedule' || process.env.EVENT === 'repository_dispatch' || process.env.TEST_OPEN_SOURCE === 'true'),
            qwenFileTimeoutMs: Number(process.env.QWEN_FILE_TIMEOUT_MIN || 45) * 60000,
            qwenBlockTimeoutMs: 6 * 60000,
            bitrate: process.env.AUDIO_BITRATE || '48k',
            rate: 24000,
          };

          const audioRun = (cmd, args, { timeout = 10 * 60000, input } = {}) => new Promise((resolve, reject) => {
            const child = qdSpawn(cmd, args, { stdio: ['pipe', 'pipe', 'pipe'] });
            let out = '';
            let err = '';
            const timer = setTimeout(() => { child.kill('SIGKILL'); reject(new Error(`${path.basename(cmd)}: tempo scaduto`)); }, timeout);
            child.stdout.on('data', (d) => { out += d; });
            child.stderr.on('data', (d) => { err += d; });
            child.on('error', (e) => { clearTimeout(timer); reject(e); });
            child.on('close', (code) => {
              clearTimeout(timer);
              if (code === 0) resolve(out);
              else reject(new Error(`${path.basename(cmd)} uscito con codice ${code}: ${(err || out).slice(-300)}`));
            });
            if (input !== undefined) child.stdin.end(input); else child.stdin.end();
          });

          /* ---------- 1. Copione per l'ascolto ---------- */
          const SCRIPT_SCHEMA = {
            type: 'object',
            properties: { blocks: { type: 'array', items: { type: 'string' } } },
            required: ['blocks'],
          };

          function cleanSpeech(s) {
            return String(s ?? '')
              .replace(/\bhttps?:\/\/\S+/gi, '')
              .replace(/[*_#`~[\]<>|]/g, '')
              .replace(/\s+/g, ' ')
              .trim();
          }

          // Divide un testo lungo in blocchi da ~maxWords parole, tagliando a fine frase
          function chunkText(text, maxWords = 170) {
            const sentences = String(text).match(/[^.!?…]+[.!?…]+["»”]?\s*|[^.!?…]+$/g) || [String(text)];
            const blocks = [];
            let cur = '';
            for (const s of sentences) {
              const next = cur ? `${cur} ${s.trim()}` : s.trim();
              if (cur && next.split(/\s+/).length > maxWords) { blocks.push(cur); cur = s.trim(); } else cur = next;
            }
            if (cur) blocks.push(cur);
            return blocks.filter((b) => b.length > 1);
          }

          async function speechScript(kind, data, fallbackText) {
            const isNews = kind === 'news';
            const source = isNews
              ? [
                `Edizione: ${data.kind === 'weekly' ? 'riepilogo della settimana' : 'giornale del mattino'} di ${data.date}.`,
                `In breve: ${(data.brief || []).join(' ')}`,
                ...(data.sections || []).flatMap((s) => [`SEZIONE ${s.title}:`, ...(s.stories || []).map((st) => `- ${st.title}. ${st.lead || ''} ${st.body || st.summary || ''} Perché conta: ${st.why || ''}`)]),
              ].join('\n')
              : [
                `Lezione: ${data.title} (categoria ${data.category}).`,
                data.series ? `Fa parte del percorso "${data.series.title}", parte ${data.series.part} di ${data.series.total}.` : '',
                `Domanda iniziale: ${data.hook}`,
                ...(data.sections || []).map((s) => `${s.heading}: ${s.body}`),
                data.example ? `Esempio: ${data.example}` : '',
                (data.keyTakeaways || []).length ? `Da ricordare: ${data.keyTakeaways.join(' ')}` : '',
                data.funFact ? `Curiosità: ${data.funFact}` : '',
              ].filter(Boolean).join('\n');

            const style = isNews
              ? `Sei il conduttore di un notiziario radiofonico italiano del mattino. Trasforma il materiale in un copione da leggere ad alta voce:
          - apri con un saluto breve e la data detta per esteso;
          - usa raccordi naturali tra sezioni e notizie ("Passiamo all'economia", "Restiamo in Italia");
          - frasi brevi e scorrevoli, tono caldo e sicuro, niente elenchi;
          - chiudi con un saluto breve e un augurio di buona giornata.`
              : `Sei il narratore di un documentario divulgativo italiano. Trasforma la lezione in un racconto da ascoltare:
          - apri con la domanda centrale per incuriosire;
          - ritmo disteso, frasi chiare, qualche domanda retorica per far riflettere;
          - riprendi alla fine i tre concetti da ricordare in modo discorsivo;
          - chiudi con una frase che lascia il segno.`;

            try {
              const { text } = await gemini({
                schema: SCRIPT_SCHEMA,
                temperature: 0.6,
                system: 'Scrivi testi in italiano pensati per essere ascoltati, non letti. Non inventare fatti: usa solo il materiale fornito.',
                prompt: `${style}

          REGOLE DI SCRITTURA PER LA VOCE:
          - Numeri, date, percentuali e valute in lettere quando aiuta la pronuncia ("due virgola cinque per cento", "tre novembre").
          - Sigle: scrivile come si pronunciano se non sono parole comuni ("bi-ci-e" per BCE è sbagliato: scrivi "la Banca centrale europea" la prima volta).
          - Niente URL, niente simboli, niente parentesi, niente emoji, niente markdown.
          - Lunghezza simile al materiale originale${isNews ? ' (circa 9-11 minuti di ascolto)' : ' (circa 5 minuti di ascolto)'}.
          - Restituisci "blocks": il copione diviso in blocchi da 120-180 parole, ognuno che finisce a fine frase.

          MATERIALE:
          ${source}`,
              });
              const blocks = (parseJSON(text).blocks || []).map(cleanSpeech).filter((b) => b.split(/\s+/).length >= 3);
              const total = blocks.join(' ').split(/\s+/).length;
              if (blocks.length && total >= (isNews ? 600 : 300)) {
                // Blocchi troppo lunghi vengono ridivisi
                return { blocks: blocks.flatMap((b) => (b.split(/\s+/).length > 220 ? chunkText(b) : [b])), rewritten: true };
              }
              log(`Audio ${kind}: copione troppo corto (${total} parole), uso il testo originale`);
            } catch (err) {
              log(`Audio ${kind}: riscrittura non riuscita (${err.message}), uso il testo originale`);
            }
            return { blocks: chunkText(cleanSpeech(fallbackText)), rewritten: false };
          }

          /* ---------- 2. WAV ---------- */
          function parseWav(buf) {
            if (buf.length < 44 || buf.toString('ascii', 0, 4) !== 'RIFF' || buf.toString('ascii', 8, 12) !== 'WAVE') throw new Error('WAV non valido');
            let off = 12;
            let fmt = null;
            while (off + 8 <= buf.length) {
              const id = buf.toString('ascii', off, off + 4);
              let size = buf.readUInt32LE(off + 4);
              const body = off + 8;
              if (id === 'fmt ') {
                fmt = { channels: buf.readUInt16LE(body + 2), rate: buf.readUInt32LE(body + 4), bits: buf.readUInt16LE(body + 14) };
              } else if (id === 'data') {
                if (!fmt) throw new Error('WAV senza formato');
                if (size === 0 || body + size > buf.length) size = buf.length - body; // intestazioni in streaming
                return { ...fmt, pcm: buf.subarray(body, body + size) };
              }
              off = body + size + (size % 2);
            }
            throw new Error('WAV senza dati audio');
          }

          function wavFile(pcm, rate = AUDIO.rate) {
            const h = Buffer.alloc(44);
            h.write('RIFF', 0); h.writeUInt32LE(36 + pcm.length, 4); h.write('WAVE', 8);
            h.write('fmt ', 12); h.writeUInt32LE(16, 16); h.writeUInt16LE(1, 20); h.writeUInt16LE(1, 22);
            h.writeUInt32LE(rate, 24); h.writeUInt32LE(rate * 2, 28); h.writeUInt16LE(2, 32); h.writeUInt16LE(16, 34);
            h.write('data', 36); h.writeUInt32LE(pcm.length, 40);
            return Buffer.concat([h, pcm]);
          }

          const silence = (seconds, rate = AUDIO.rate) => Buffer.alloc(Math.round(seconds * rate) * 2);

          /* ---------- 3. Motori ---------- */
          async function ttsQwen(blocks, speaker, tmp) {
            if (!AUDIO.qwenBin || !existsSync(AUDIO.qwenBin)) throw new Error('motore Qwen3-TTS non installato');
            if (!AUDIO.qwenModel || !existsSync(AUDIO.qwenModel)) throw new Error('modello Qwen3-TTS non trovato');
            const deadline = Date.now() + AUDIO.qwenFileTimeoutMs;
            const parts = [];
            for (let i = 0; i < blocks.length; i++) {
              const left = deadline - Date.now();
              if (left <= 0) throw new Error('Qwen3-TTS troppo lento: tempo massimo superato');
              const out = path.join(tmp, `qwen-${i}.wav`);
              await audioRun(AUDIO.qwenBin, [
                '-d', AUDIO.qwenModel, '-s', speaker, '-l', 'Italian', '--int4', '--silent',
                '--text', blocks[i], '-o', out,
              ], { timeout: Math.min(left, AUDIO.qwenBlockTimeoutMs) });
              const wav = parseWav(await readFile(out));
              if (wav.channels !== 1 || wav.bits !== 16) throw new Error(`formato audio inatteso da Qwen3-TTS (${wav.channels} canali, ${wav.bits} bit)`);
              const seconds = wav.pcm.length / 2 / wav.rate;
              const words = blocks[i].split(/\s+/).length;
              // Controllo di qualità: troppo corto o troppo lungo rispetto al testo = generazione difettosa
              if (seconds < words * 0.18 || seconds > words * 1.2 + 5) throw new Error(`blocco ${i + 1} di durata anomala (${seconds.toFixed(1)} s per ${words} parole)`);
              parts.push(wav.rate === AUDIO.rate ? wav.pcm : await resample(wav, tmp, i));
              log(`  Qwen3-TTS blocco ${i + 1}/${blocks.length}: ${seconds.toFixed(1)} s`);
            }
            return parts;
          }

          async function resample(wav, tmp, i) {
            const src = path.join(tmp, `rs-in-${i}.wav`);
            const dst = path.join(tmp, `rs-out-${i}.wav`);
            await writeFile(src, wavFile(wav.pcm, wav.rate));
            await audioRun('ffmpeg', ['-y', '-loglevel', 'error', '-i', src, '-ar', String(AUDIO.rate), '-ac', '1', '-c:a', 'pcm_s16le', dst]);
            return parseWav(await readFile(dst)).pcm;
          }

          async function ttsEdge(blocks, voice, rate, tmp) {
            const parts = [];
            const voicesToTry = [voice, 'it-IT-DiegoNeural', 'it-IT-IsabellaNeural'].filter((v, idx, arr) => v && arr.indexOf(v) === idx);
            for (let i = 0; i < blocks.length; i++) {
              const txt = path.join(tmp, `edge-${i}.txt`);
              const mp3 = path.join(tmp, `edge-${i}.mp3`);
              const wavOut = path.join(tmp, `edge-${i}.wav`);
              await writeFile(txt, blocks[i], 'utf8');
              let lastErr;
              for (const v of voicesToTry) {
                for (let attempt = 1; attempt <= 2; attempt++) {
                  try {
                    await audioRun('edge-tts', ['--voice', v, `--rate=${rate}`, '-f', txt, '--write-media', mp3], { timeout: 3 * 60000 });
                    lastErr = null;
                    break;
                  } catch (err) {
                    lastErr = err;
                    await new Promise((r) => setTimeout(r, 2000 * attempt));
                  }
                }
                if (!lastErr) break;
              }
              if (lastErr) throw lastErr;
              await audioRun('ffmpeg', ['-y', '-loglevel', 'error', '-i', mp3, '-ar', String(AUDIO.rate), '-ac', '1', '-c:a', 'pcm_s16le', wavOut]);
              parts.push(parseWav(await readFile(wavOut)).pcm);
              await new Promise((r) => setTimeout(r, 400));
            }
            return parts;
          }

          async function writeMp3(parts, dest, tmp, pauseSeconds) {
            const gap = silence(pauseSeconds);
            const pcm = Buffer.concat(parts.flatMap((p, i) => (i ? [gap, p] : [p])));
            const wavPath = path.join(tmp, 'full.wav');
            await writeFile(wavPath, wavFile(pcm));
            await mkdir(path.dirname(dest), { recursive: true });
            await audioRun('ffmpeg', ['-y', '-loglevel', 'error', '-i', wavPath, '-ac', '1', '-codec:a', 'libmp3lame', '-b:a', AUDIO.bitrate, dest]);
            return pcm.length / 2 / AUDIO.rate;
          }

          /* ---------- 4. Orchestrazione ---------- */
          async function makeAudio(kind, data, fallbackText) {
            const t0 = Date.now();
            const tmp = await qdMkdtemp(path.join(process.env.RUNNER_TEMP || qdOs.tmpdir(), `qd-audio-${kind}-`));
            try {
              const { blocks, rewritten } = await speechScript(kind, data, fallbackText);
              if (!blocks.length) throw new Error('nessun testo da leggere');
              const dest = path.join(AUDIO.dir, `${kind}-${today}.mp3`);
              const pause = kind === 'news' ? 0.6 : 0.8;
              let engine = 'edge-tts';
              let voice = AUDIO.edgeVoice;
              let parts = null;
              let fallbackReason = '';

              if (AUDIO.useOpenSource) {
                const speaker = kind === 'news' ? AUDIO.qwenSpeakerNews : AUDIO.qwenSpeakerLesson;
                try {
                  parts = await ttsQwen(blocks, speaker, tmp);
                  engine = 'qwen3-tts';
                  voice = speaker;
                } catch (err) {
                  fallbackReason = err.message;
                  note(`Audio ${kind}: voce open source non riuscita (${err.message}), uso edge-tts`);
                }
              }
              if (!parts) parts = await ttsEdge(blocks, AUDIO.edgeVoice, kind === 'lesson' ? '-5%' : '+0%', tmp);

              const seconds = await writeMp3(parts, dest, tmp, pause);
              await qdCopyFile(dest, path.join(AUDIO.dir, `${kind}-latest.mp3`));

              const indexPath = path.join(AUDIO.dir, 'index.json');
              const idx = await readJSON(indexPath, { files: {} });
              idx.files = idx.files || {};
              idx.files[`${kind}-${today}.mp3`] = {
                date: today, kind, engine, voice, seconds: Math.round(seconds), rewritten,
                ...(fallbackReason ? { fallbackReason: fallbackReason.slice(0, 200) } : {}),
                generatedAt: new Date().toISOString(),
              };
              idx.files[`${kind}-latest.mp3`] = { ...idx.files[`${kind}-${today}.mp3`] };
              idx.updatedAt = new Date().toISOString();
              await writeJSON(indexPath, idx);
              note(`Audio ${kind}: ${Math.round(seconds / 60)} min con ${engine} (voce ${voice}) in ${Math.round((Date.now() - t0) / 1000)} s`);
            } finally {
              await qdRm(tmp, { recursive: true, force: true }).catch(() => {});
            }
          }

          async function cleanupAudioIndex() {
            const indexPath = path.join(AUDIO.dir, 'index.json');
            const idx = await readJSON(indexPath, null);
            if (!idx?.files) return;
            const existing = new Set(existsSync(AUDIO.dir) ? await readdir(AUDIO.dir) : []);
            for (const name of Object.keys(idx.files)) if (!existing.has(name)) delete idx.files[name];
            await writeJSON(indexPath, idx);
          }

          // Genera l'audio dei contenuti di oggi. Se l'MP3 di oggi esiste già lo salta,
          // a meno che i contenuti siano più recenti dell'audio (rigenerazione manuale).
          async function generateAudioForToday() {
            const jobs = [];
            const news = await readJSON(path.join(DATA, 'news', 'latest.json'), null);
            if (news?.date === today) jobs.push(['news', news, formatNewsSpeech(news)]);
            const lessonPath = path.join(DATA, 'lessons', `${today}.json`);
            const lesson = await readJSON(lessonPath, null);
            if (lesson) jobs.push(['lesson', lesson, formatLessonSpeech(lesson)]);

            const idx = await readJSON(path.join(AUDIO.dir, 'index.json'), { files: {} });
            let audioFailed = false;
            for (const [kind, data, fallbackText] of jobs) {
              const meta = idx.files?.[`${kind}-${today}.mp3`];
              const exists = existsSync(path.join(AUDIO.dir, `${kind}-${today}.mp3`));
              const stale = !meta || (data.generatedAt && meta.generatedAt < data.generatedAt);
              const upgrade = AUDIO.useOpenSource && meta?.engine === 'edge-tts' && process.env.TEST_OPEN_SOURCE === 'true';
              if (exists && !stale && !upgrade) { note(`Audio ${kind}: già presente`); continue; }
              try {
                await makeAudio(kind, data, fallbackText);
              } catch (err) {
                audioFailed = true;
                note(`Errore audio ${kind}: ${err.message}`);
              }
            }
            await cleanupAudioIndex();
            return !audioFailed;
          }
          /* ===================== QUOTIDIE AUDIO v2 — FINE ===================== */

          function formatNewsSpeech(n) {
            let t = `Quotidie. ${n.kind === 'weekly' ? 'La settimana' : 'Il giornale'} di ${longDate(n.date)}. Ecco i fatti principali.\n\n`;
            if (n.brief && n.brief.length) {
              t += `Le notizie in breve: ${n.brief.join('. ')}.\n\n`;
            }
            for (const sec of n.sections || []) {
              t += `Sezione: ${sec.title}.\n\n`;
              for (const st of sec.stories || []) {
                t += `${st.title}.\n`;
                if (st.lead) t += `${st.lead}\n`;
                t += `${st.body || st.summary || ''}\n`;
                if (st.why) t += `Perché conta: ${st.why}.\n\n`;
              }
            }
            t += `Questa era la rassegna di oggi di Quotidie. Buona giornata e a domani.\n`;
            return t.replace(/\bhttps?:\/\/\S+/gi, '').replace(/[*_#`~\[\]]/g, '').trim();
          }

          function formatLessonSpeech(l) {
            let t = `Quotidie. Lezione del giorno: ${l.title}. Categoria: ${l.category}.\n\n`;
            if (l.hook) t += `${l.hook}\n\n`;
            for (const sec of l.sections || []) {
              t += `${sec.heading}.\n${sec.body}\n\n`;
            }
            if (l.example) t += `Un esempio concreto: ${l.example}\n\n`;
            if (l.keyTakeaways && l.keyTakeaways.length) t += `Punti chiave da ricordare: ${l.keyTakeaways.join('. ')}.\n\n`;
            if (l.funFact) t += `Curiosità: ${l.funFact}\n\n`;
            t += `Fine della lezione. Buona continuazione con Quotidie.\n`;
            return t.replace(/\bhttps?:\/\/\S+/gi, '').replace(/[*_#`~\[\]]/g, '').trim();
          }

          async function generateAudioFile(text, destPath) {
            await mkdir(path.dirname(destPath), { recursive: true });
            const tempTxt = path.join(process.env.RUNNER_TEMP || '.', `audio-${Date.now()}-${Math.random().toString(36).slice(2)}.txt`);
            await writeFile(tempTxt, text, 'utf8');
            try {
              await pExec('edge-tts', ['--voice', VOICE, '-f', tempTxt, '--write-media', destPath]);
              log(`Audio generato: ${path.basename(destPath)}`);
            } finally {
              try { await unlink(tempTxt); } catch {}
            }
          }

          async function cleanupOldAudio() {
            if (!existsSync(AUDIO_DIR)) return;
            const files = await readdir(AUDIO_DIR);
            const cutoff = addDays(today, -KEEP_NEWS_DAYS);
            for (const f of files) {
              const match = f.match(/^(?:news|lesson)-(\d{4}-\d{2}-\d{2})\.mp3$/);
              if (match && match[1] < cutoff) {
                await unlink(path.join(AUDIO_DIR, f));
                log(`Rimosso vecchio audio: ${f}`);
              }
            }
          }

          /* ---------- Gemini ---------- */
          // Modello: variabile GEMINI_MODEL, altrimenti il default. Se Google lo ritira (404),
          // si passa da solo al modello Flash più recente disponibile per la tua chiave.
          let MODEL = (process.env.GEMINI_MODEL || '').trim() || 'gemini-3.8-flash';
          const triedModels = new Set();

          async function pickFallbackModel() {
            const res = await fetch(`${API_BASE}/models?pageSize=1000`, { headers: { 'x-goog-api-key': API_KEY } });
            if (!res.ok) return null;
            const { models = [] } = await res.json();
            const version = (name) => (name.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1];
            const candidates = models
              .filter((m) => (m.supportedGenerationMethods || []).includes('generateContent'))
              .map((m) => m.name.replace(/^models\//, ''))
              .filter((n) => /^gemini-[\d.]+-flash$/.test(n) || n === 'gemini-flash-latest')
              .filter((n) => !triedModels.has(n))
              .sort((a, b) => (parseFloat(version(b)) || 0) - (parseFloat(version(a)) || 0));
            return candidates[0] || null;
          }

          // Formato della risposta JSON: se l'API non accetta un campo, si prova il successivo
          const SCHEMA_MODES = ['jsonSchema', 'openApi', 'prompt'];
          let schemaMode = 0;

          function toOpenApi(schema) {
            if (Array.isArray(schema)) return schema.map(toOpenApi);
            if (!schema || typeof schema !== 'object') return schema;
            const out = {};
            for (const [k, v] of Object.entries(schema)) {
              if (k === 'type') out.type = String(v).toUpperCase();
              else if (k === 'properties') out.properties = Object.fromEntries(Object.entries(v).map(([pk, pv]) => [pk, toOpenApi(pv)]));
              else if (['items', 'required', 'enum', 'description'].includes(k)) out[k] = toOpenApi(v);
            }
            return out;
          }

          async function gemini({ prompt, system, schema, search = false, temperature = 0.7 }) {
            for (let attempt = 1; attempt <= 6; attempt++) {
              const mode = SCHEMA_MODES[schemaMode];
              const body = {
                contents: [{ role: 'user', parts: [{ text: schema && mode === 'prompt'
                  ? `${prompt}\n\nRispondi SOLO con un oggetto JSON valido, senza testo prima o dopo, che rispetti questo JSON Schema:\n${JSON.stringify(schema)}`
                  : prompt }] }],
                generationConfig: { temperature },
              };
              if (system) body.systemInstruction = { parts: [{ text: system }] };
              if (search) body.tools = [{ google_search: {} }];
              if (schema) {
                body.generationConfig.responseMimeType = 'application/json';
                if (mode === 'jsonSchema') body.generationConfig.responseJsonSchema = schema;
                if (mode === 'openApi') body.generationConfig.responseSchema = toOpenApi(schema);
              }

              let res;
              try {
                res = await fetch(`${API_BASE}/models/${MODEL}:generateContent`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'x-goog-api-key': API_KEY },
                  body: JSON.stringify(body),
                  signal: AbortSignal.timeout(180000),
                });
              } catch (err) {
                if (attempt < 6) { log(`Rete non raggiungibile (${err.message}), nuovo tentativo`); await sleep(5000 * attempt); continue; }
                throw err;
              }

              if (res.ok) {
                const data = await res.json();
                const cand = data.candidates?.[0];
                const text = (cand?.content?.parts || []).filter((p) => !p.thought).map((p) => p.text || '').join('').trim();
                if (!text) {
                  if (attempt < 6) { log(`Risposta vuota (${cand?.finishReason || data.promptFeedback?.blockReason || 'motivo sconosciuto'}), nuovo tentativo`); continue; }
                  throw new Error(`Risposta vuota da Gemini (${cand?.finishReason || 'motivo sconosciuto'})`);
                }
                return { text, grounding: cand.groundingMetadata };
              }

              const errText = await res.text();
              if (res.status === 404 || (res.status === 400 && /model/i.test(errText) && /not found|not supported/i.test(errText))) {
                triedModels.add(MODEL);
                const next = await pickFallbackModel();
                if (!next) throw new Error(`Il modello "${MODEL}" non è disponibile e non ho trovato alternative. Imposta la variabile GEMINI_MODEL. ${errText.slice(0, 200)}`);
                note(`Il modello ${MODEL} non è disponibile: uso ${next}. Per sceglierlo tu imposta la variabile GEMINI_MODEL.`);
                MODEL = next;
                continue;
              }
              if (res.status === 400 && schema && schemaMode < SCHEMA_MODES.length - 1 && /response_?json_?schema|response_?schema|unknown name|invalid json payload/i.test(errText)) {
                schemaMode++;
                log(`L'API non accetta il formato "${mode}": passo a "${SCHEMA_MODES[schemaMode]}"`);
                continue;
              }
              if (res.status === 400 && /api key not valid|api_key_invalid/i.test(errText)) {
                throw new Error('La API key di Gemini non è valida: aggiorna il secret GEMINI_API_KEY.');
              }
              if ([429, 500, 502, 503, 504].includes(res.status) && attempt < 6) {
                const wait = Math.min(60000, 2 ** attempt * 3000);
                log(`Gemini ${res.status}, nuovo tentativo tra ${wait / 1000}s`);
                await sleep(wait);
                continue;
              }
              throw new Error(`Gemini ${res.status}: ${errText.slice(0, 400)}`);
            }
            throw new Error('Gemini non ha risposto dopo vari tentativi');
          }

          function parseJSON(text) {
            const clean = text.trim().replace(/^```(?:json)?\s*|\s*```$/g, '');
            try { return JSON.parse(clean); } catch {}
            const start = clean.indexOf('{');
            const end = clean.lastIndexOf('}');
            if (start >= 0 && end > start) return JSON.parse(clean.slice(start, end + 1));
            throw new Error('La risposta di Gemini non è un JSON valido');
          }

          /* ---------- Fonti ---------- */
          // Inserisce nel testo della ricerca i riferimenti [n] alle fonti che supportano ogni frase
          function annotate(text, supports = []) {
            const marks = [];
            for (const s of supports) {
              const seg = s.segment?.text;
              const ids = s.groundingChunkIndices || [];
              if (!seg || !ids.length) continue;
              const at = text.indexOf(seg);
              if (at >= 0) marks.push({ pos: at + seg.length, label: ` [${ids.join(',')}]` });
            }
            marks.sort((a, b) => b.pos - a.pos);
            let out = text;
            for (const m of marks) out = out.slice(0, m.pos) + m.label + out.slice(m.pos);
            return out;
          }

          // I link di Google Search sono reindirizzamenti temporanei: si risolvono nell'indirizzo vero
          // dell'articolo. Un link che risponde 404/410 viene scartato; se il controllo non riesce
          // per motivi di rete si tiene il link originale, che funziona comunque nel browser.
          const UA = 'Mozilla/5.0 (compatible; QuotidieBot/1.0; +https://github.com)';
          async function verifySource(uri) {
            try {
              const res = await fetch(uri, { redirect: 'manual', headers: { 'User-Agent': UA }, signal: AbortSignal.timeout(8000) });
              res.body?.cancel().catch(() => {});
              const loc = res.headers.get('location');
              if (res.status >= 300 && res.status < 400 && loc) return { url: new URL(loc, uri).href, resolved: true };
              if (res.status === 404 || res.status === 410) return null;
              return { url: uri, resolved: res.status < 300 };
            } catch {
              return { url: uri, resolved: false };
            }
          }
          const hostOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return 'Fonte'; } };
          const isRedirector = (url) => /vertexaisearch\.cloud\.google\.com|google\.com\/url/i.test(url);

          /* ---------- Notizie ---------- */
          const NEWS_DESKS = [
            { id: 'tech', title: 'Tecnologia e AI', count: 4, focus: 'intelligenza artificiale, big tech, startup, semiconduttori, ricerca, regolamentazione tech' },
            { id: 'finance', title: 'Finanza e mercati', count: 3, focus: 'mercati azionari e obbligazionari, banche centrali, tassi, materie prime, crypto rilevanti, risultati societari importanti' },
            { id: 'italy', title: 'Italia', count: 3, focus: 'politica, economia e società italiana' },
            { id: 'world', title: 'Mondo', count: 3, focus: 'esteri, geopolitica, grandi eventi internazionali' },
          ];
          const STORY_COUNT = NEWS_DESKS.reduce((n, d) => n + d.count, 0);

          const NEWS_SCHEMA = {
            type: 'object',
            properties: {
              brief: { type: 'array', items: { type: 'string' } },
              sections: {
                type: 'array',
                items: {
                  type: 'object',
                  properties: {
                    id: { type: 'string', enum: NEWS_DESKS.map((d) => d.id) },
                    stories: {
                      type: 'array',
                      items: {
                        type: 'object',
                        properties: {
                          title: { type: 'string' },
                          lead: { type: 'string' },
                          body: { type: 'string' },
                          why: { type: 'string' },
                          sourceIds: { type: 'array', items: { type: 'integer' } },
                        },
                        required: ['title', 'lead', 'body', 'why', 'sourceIds'],
                      },
                    },
                  },
                  required: ['id', 'stories'],
                },
              },
            },
            required: ['brief', 'sections'],
          };

          async function readEditions(fromDay, toDay) {
            const out = [];
            for (let d = fromDay; d <= toDay; d = addDays(d, 1)) {
              const n = await readJSON(path.join(DATA, 'news', `${d}.json`), null);
              if (n?.sections) out.push(n);
            }
            return out;
          }

          const storyWords = (st) => words([st.title, st.lead, st.body, st.why].join(' '));

          async function generateNews() {
            const weekly = IS_SUNDAY;
            const deskList = NEWS_DESKS.map((d) => `- ${d.title} (${d.count} notizie): ${d.focus}`).join('\n');
            const range = weekly ? { from: addDays(today, -6), to: today } : null;

            let researchPrompt;
            if (weekly) {
              const past = (await readEditions(range.from, addDays(today, -1))).filter((n) => n.kind !== 'weekly');
              const hints = past.flatMap((n) => arr(n.sections).flatMap((s) => arr(s.stories).map((st) => `${shortDate(n.date)}, ${s.title}: ${st.title}`)));
              researchPrompt = `Oggi è ${longDate(today)}. Prepara il riepilogo della settimana dal ${shortDate(range.from)} al ${shortDate(today)}: cerca i fatti più importanti della settimana e i loro sviluppi più recenti per queste sezioni:
          ${deskList}

          Per ogni fatto riporta cosa è successo, gli sviluppi nel corso della settimana, i numeri chiave, il contesto e perché conta. Privilegia ciò che avrà conseguenze anche nelle prossime settimane.${hints.length ? `

          Titoli usciti nelle edizioni di questa settimana, da usare come traccia (verificali e aggiornali):
          ${hints.join('\n')}` : ''}`;
            } else {
              researchPrompt = `Oggi è ${longDate(today)}. Cerca le notizie più importanti delle ultime 24-36 ore per queste sezioni:
          ${deskList}

          Per ogni notizia riporta: i fatti essenziali (chi, cosa, quando, dove), i numeri chiave, il contesto, le reazioni e perché è rilevante. Preferisci fonti autorevoli (agenzie, quotidiani nazionali e internazionali, testate di settore). Scarta gossip e notizie minori. Evita doppioni tra le sezioni.`;
            }

            log(`Notizie (${weekly ? 'riepilogo settimanale' : 'giornaliere'}): ricerca con Google Search`);
            let research = null;
            let chunks = [];
            let annotated = '';
            for (let rAttempt = 1; rAttempt <= 3; rAttempt++) {
              try {
                research = await gemini({
                  search: true,
                  temperature: 0.3,
                  system: 'Sei il caporedattore di un quotidiano italiano di qualità. Lavori solo su fatti verificati e recenti, citando le fonti. Non inventi nulla.',
                  prompt: researchPrompt,
                });
                chunks = arr(research.grounding?.groundingChunks).map((c) => c.web || {});
                annotated = annotate(research.text, research.grounding?.groundingSupports);
                const foundCount = chunks.filter((c) => c.uri).length;
                log(`Notizie: ${foundCount} fonti trovate dalla ricerca${rAttempt > 1 ? ` (tentativo ${rAttempt})` : ''}`);
                if (foundCount > 0) break;
                if (rAttempt < 3) {
                  log('Nessuna fonte trovata nella risposta, nuovo tentativo tra 6s...');
                  await sleep(6000);
                }
              } catch (err) {
                log(`Ricerca notizie: tentativo ${rAttempt} fallito (${err.message})`);
                if (rAttempt < 3) await sleep(6000);
                else throw err;
              }
            }
            const sourceList = chunks.map((c, i) => (c.uri ? `[${i}] ${c.title || hostOf(c.uri)}` : null)).filter(Boolean).join('\n');

            const verified = new Map(); // id → { url, title } oppure null
            const verify = async (ids) => {
              const todo = [...new Set(ids)].filter((id) => Number.isInteger(id) && !verified.has(id) && chunks[id]?.uri);
              await mapLimit(todo, 8, async (id) => {
                const v = await verifySource(chunks[id].uri);
                if (!v) return verified.set(id, null);
                const domain = chunks[id].title && /\.[a-z]{2,}$/i.test(chunks[id].title.trim()) ? chunks[id].title.trim().replace(/^www\./, '') : null;
                verified.set(id, { url: v.url, title: !isRedirector(v.url) ? hostOf(v.url) : (domain || 'Fonte') });
              });
            };

            let best = null;
            for (let attempt = 1; attempt <= 3; attempt++) {
              let draft;
              try {
                const { text } = await gemini({
                  schema: NEWS_SCHEMA,
                  temperature: 0.4,
                  system: 'Sei un redattore italiano: scrivi in un italiano chiaro, preciso e sobrio, da quotidiano di qualità. Niente sensazionalismo, niente emoji.',
                  prompt: `Trasforma questa rassegna in ${weekly ? 'un riepilogo della settimana' : 'un giornale del mattino'} in italiano, da leggere in circa 10 minuti.

          RASSEGNA (i numeri tra parentesi quadre indicano le fonti di ogni frase):
          ${annotated}

          FONTI:
          ${sourceList || '(nessuna)'}

          REGOLE:
          - Sezioni e numero di notizie: ${NEWS_DESKS.map((d) => `${d.id}=${d.count}`).join(', ')}.
          - "brief": esattamente 3 frasi, una per ciascuno dei fatti più importanti ${weekly ? 'della settimana' : 'di oggi'} (max 30 parole l'una).
          - "title": titolo informativo, max 12 parole, senza punto finale.
          - "lead": la notizia in una o due frasi (20-30 parole): il fatto principale, chiaro anche da solo.
          - "body": 90-120 parole in 2 paragrafi separati da una riga vuota. Non ripetere il lead: aggiungi dettagli, numeri, contesto, reazioni${weekly ? ' e gli sviluppi della settimana' : ''}.
          - "why": una frase (max 25 parole) che spiega perché la notizia conta.
          - "sourceIds": i numeri [n] delle fonti che supportano la notizia (1-3). Includi SOLO notizie supportate da almeno una fonte dell'elenco.
          - Lunghezza totale tra ${LIMITS.news.target} parole.
          - Usa solo informazioni presenti nella rassegna.`,
                });
                draft = parseJSON(text);
              } catch (err) {
                log(`Notizie: tentativo ${attempt} non valido (${err.message})`);
                continue;
              }

              const drafts = arr(draft.sections);
              await verify(drafts.flatMap((s) => arr(s.stories).flatMap((st) => arr(st.sourceIds))));

              let dropped = 0;
              const seen = new Set();
              const sections = NEWS_DESKS.map((desk) => {
                const s = drafts.find((x) => x?.id === desk.id) || { stories: [] };
                const stories = [];
                for (const st of arr(s.stories)) {
                  const title = str(st.title);
                  const lead = str(st.lead);
                  const body = str(st.body);
                  if (!title || !lead || !body) { dropped++; continue; }
                  const key = slug(title);
                  const sources = [...new Set(arr(st.sourceIds))].map((id) => verified.get(id)).filter(Boolean)
                    .filter((src, i, all) => all.findIndex((x) => x.url === src.url) === i).slice(0, 3);
                  // Controllo fonti: una notizia senza almeno una fonte reale non viene pubblicata
                  if (!sources.length || seen.has(key)) { dropped++; continue; }
                  seen.add(key);
                  const story = { title, lead, body, why: str(st.why), sources };
                  story.readSeconds = Math.max(20, Math.round(storyWords(story) / WPM * 60));
                  stories.push(story);
                  if (stories.length === desk.count) break;
                }
                return { id: desk.id, title: desk.title, stories };
              }).filter((s) => s.stories.length);

              const brief = arr(draft.brief).map(str).filter(Boolean).slice(0, 3);
              const storyCount = sections.reduce((n, s) => n + s.stories.length, 0);
              const total = words(brief.join(' ')) + sections.reduce((n, s) => n + s.stories.reduce((m, st) => m + storyWords(st), 0), 0);
              log(`Notizie: ${storyCount} con fonte verificata, ${dropped} scartate, ${total} parole (tentativo ${attempt})`);

              const news = {
                date: today,
                kind: weekly ? 'weekly' : 'daily',
                ...(range ? { range } : {}),
                generatedAt: new Date().toISOString(),
                model: MODEL,
                minutes: Math.max(1, Math.round(total / WPM)),
                words: total,
                brief,
                sections,
                dropped,
              };
              const fits = total >= LIMITS.news.min && total <= LIMITS.news.max;
              const score = storyCount * 10 + (fits ? 5 : 0);
              if (!best || score > best.score) best = { news, storyCount, dropped, score, fits };
              if (fits && storyCount >= MIN_STORIES) break;
            }
            if (!best || best.storyCount < 6) throw new Error('Troppe poche notizie con fonti verificate dopo 3 tentativi');
            note(`Giornale${best.news.kind === 'weekly' ? ' (riepilogo della settimana)' : ''}: ${best.storyCount} notizie, circa ${best.news.minutes} minuti${best.dropped ? `, ${best.dropped} scartate perché senza fonte verificata` : ''}`);
            return best.news;
          }

          async function saveNews(news) {
            const dir = path.join(DATA, 'news');
            await writeJSON(path.join(dir, 'latest.json'), news);
            await writeJSON(path.join(dir, `${today}.json`), news);
            const files = (await readdir(dir)).filter((f) => /^\d{4}-\d{2}-\d{2}\.json$/.test(f)).sort();
            for (const f of files.slice(0, Math.max(0, files.length - KEEP_NEWS_DAYS))) await unlink(path.join(dir, f));
            const editions = [];
            for (const f of files.slice(-KEEP_NEWS_DAYS).reverse()) {
              const n = await readJSON(path.join(dir, f), null);
              if (n?.date) editions.push({ date: n.date, kind: n.kind || 'daily', ...(n.range ? { range: n.range } : {}) });
            }
            await writeJSON(path.join(dir, 'index.json'), { editions });

          }

          /* ---------- Lezione ---------- */
          const LESSON_SCHEMA = {
            type: 'object',
            properties: {
              title: { type: 'string' },
              hook: { type: 'string' },
              sections: {
                type: 'array',
                items: {
                  type: 'object',
                  properties: { heading: { type: 'string' }, body: { type: 'string' } },
                  required: ['heading', 'body'],
                },
              },
              example: { type: 'string' },
              keyTakeaways: { type: 'array', items: { type: 'string' } },
              funFact: { type: 'string' },
              furtherReading: {
                type: 'array',
                items: {
                  type: 'object',
                  properties: { title: { type: 'string' }, note: { type: 'string' } },
                  required: ['title'],
                },
              },
            },
            required: ['title', 'hook', 'sections', 'example', 'keyTakeaways', 'funFact', 'furtherReading'],
          };

          function pickCategory(topics, index) {
            const enabled = arr(topics.categories).filter((c) => c.enabled);
            if (!enabled.length) throw new Error('Nessuna categoria attiva in data/topics.json');
            const recent = index.slice(0, AVOID_RECENT_CATEGORIES).map((l) => l.categoryId);
            const counts = Object.fromEntries(enabled.map((c) => [c.id, index.filter((l) => l.categoryId === c.id).length]));
            let pool = enabled.filter((c) => !recent.includes(c.id));
            if (!pool.length) pool = enabled;
            // Favorisce le categorie meno trattate finora
            const min = Math.min(...pool.map((c) => counts[c.id]));
            const least = pool.filter((c) => counts[c.id] <= min + 1);
            return least[Math.floor(Math.random() * least.length)];
          }

          const pastTitles = (index) => index.slice(0, 150).map((l) => l.title).join(' | ') || '(nessuno)';

          // Lezione normale: argomento nuovo da una categoria a rotazione
          async function planRegular(topics, index) {
            const category = pickCategory(topics, index);
            const pastSame = index.filter((l) => l.categoryId === category.id).map((l) => l.title);
            const { text } = await gemini({
              temperature: 1,
              schema: { type: 'object', properties: { topic: { type: 'string' }, angle: { type: 'string' } }, required: ['topic', 'angle'] },
              prompt: `Proponi UN argomento per una lezione di microlearning di 5 minuti nella categoria "${category.name}".
          Deve essere specifico (non "la storia di Roma" ma "perché i Romani usavano il calcestruzzo pozzolanico e come si autoripara"), sorprendente, utile o affascinante per un adulto curioso e colto.
          Spazia tra livelli: concetti fondamentali, idee controintuitive, storie poco note, strumenti pratici.
          Argomenti GIÀ trattati in questa categoria, da NON ripetere né sovrapporre:
          ${pastSame.length ? pastSame.map((t) => `- ${t}`).join('\n') : '(nessuno)'}
          Altri titoli già usati: ${pastTitles(index)}
          Restituisci "topic" (l'argomento) e "angle" (l'angolazione narrativa, una frase).`,
            });
            const plan = parseJSON(text);
            return { kind: 'regular', category: category.name, categoryId: category.id, topic: str(plan.topic) || category.name, angle: str(plan.angle) };
          }

          // Domenica: la lezione spiega il concetto dietro una notizia della settimana
          async function planFromNews(index) {
            const editions = await readEditions(addDays(today, -6), today);
            const items = editions.flatMap((n) => arr(n.sections).flatMap((s) => arr(s.stories).map((st) => `- ${st.title}: ${st.lead || st.summary || ''}`)));
            if (!items.length) return null;
            const { text } = await gemini({
              temperature: 0.8,
              schema: {
                type: 'object',
                properties: { headline: { type: 'string' }, topic: { type: 'string' }, angle: { type: 'string' } },
                required: ['headline', 'topic', 'angle'],
              },
              prompt: `Queste sono le notizie della settimana:
          ${[...new Set(items)].slice(0, 60).join('\n')}

          Scegline UNA che nasconde un concetto interessante da capire a fondo (economico, scientifico, tecnologico, storico, giuridico, geopolitico). La lezione non deve riassumere la notizia: deve spiegare il concetto che serve per capirla davvero e che resterà utile anche tra un anno.
          Esempio: dalla notizia "La BCE taglia i tassi" il concetto "Come un taglio dei tassi arriva al tuo mutuo e ai prezzi".
          Titoli già usati, da non ripetere: ${pastTitles(index)}
          Restituisci "headline" (il titolo della notizia scelta, identico), "topic" (il concetto) e "angle" (l'angolazione, una frase).`,
            });
            const plan = parseJSON(text);
            if (!str(plan.topic)) return null;
            return { kind: 'news', category: "Dall'attualità", categoryId: 'attualita', topic: str(plan.topic), angle: str(plan.angle), fromNews: { headline: str(plan.headline) } };
          }

          // Percorsi: ogni 2-3 settimane una serie di 3-5 lezioni collegate
          async function planSeries(topics, index, series) {
            let cur = series.current;
            if (cur && NEW_SERIES && cur.done < cur.parts.length) note(`Il percorso "${cur.title}" è ancora in corso: continua con la prossima puntata`);
            if (!cur || cur.done >= cur.parts.length) {
              const lastEnd = series.history.at(-1)?.endedAt || index.at(-1)?.date || today;
              const gap = daysBetween(lastEnd, today);
              const due = index.length >= SERIES.minLessons && (gap >= SERIES.maxGap || (gap >= SERIES.minGap && Math.random() < SERIES.chance));
              if (!NEW_SERIES && !due) return null;

              const category = pickCategory(topics, index);
              const { text } = await gemini({
                temperature: 0.9,
                schema: {
                  type: 'object',
                  properties: {
                    title: { type: 'string' },
                    intro: { type: 'string' },
                    parts: {
                      type: 'array',
                      items: { type: 'object', properties: { title: { type: 'string' }, focus: { type: 'string' } }, required: ['title', 'focus'] },
                    },
                  },
                  required: ['title', 'intro', 'parts'],
                },
                prompt: `Progetta un percorso di microlearning di 3-5 lezioni nella categoria "${category.name}": una lezione al giorno, 5 minuti ciascuna.
          Il percorso affronta un tema ampio e affascinante passo dopo passo: ogni lezione sta in piedi da sola ma costruisce sulla precedente, dalle basi alle implicazioni.
          Esempio di tema: "Come funzionano gli LLM", "La nascita della finanza moderna", "Il cervello che decide".
          Percorsi già fatti, da non ripetere: ${series.history.map((h) => h.title).join(' | ') || '(nessuno)'}
          Titoli di lezioni già usati: ${pastTitles(index)}
          Restituisci "title" (titolo del percorso, max 7 parole), "intro" (una frase che spiega cosa si impara) e "parts" (3-5 lezioni con "title" e "focus" di una frase).`,
              });
              const plan = parseJSON(text);
              const parts = arr(plan.parts).map((p) => ({ title: str(p.title), focus: str(p.focus) })).filter((p) => p.title).slice(0, 5);
              if (parts.length < 3 || !str(plan.title)) throw new Error('Gemini ha proposto un percorso non valido');
              cur = {
                id: `${today}-${slug(plan.title)}`.slice(0, 80),
                title: str(plan.title),
                intro: str(plan.intro),
                category: category.name,
                categoryId: category.id,
                parts,
                done: 0,
                startedAt: today,
              };
              series.current = cur;
              note(`Nuovo percorso: "${cur.title}" in ${cur.parts.length} lezioni`);
            }
            const n = cur.done;
            const part = cur.parts[n];
            return {
              kind: 'series',
              category: cur.category,
              categoryId: cur.categoryId,
              topic: part.title,
              angle: part.focus,
              series: { id: cur.id, title: cur.title, intro: cur.intro, part: n + 1, total: cur.parts.length, parts: cur.parts.map((p) => p.title) },
              context: `Questa è la lezione ${n + 1} di ${cur.parts.length} del percorso "${cur.title}" (${cur.intro}).
          Lezioni del percorso: ${cur.parts.map((p, i) => `${i + 1}. ${p.title}${i === n ? ' (QUESTA)' : ''}`).join('; ')}.
          ${n > 0 ? 'Apri con una frase che si collega alla lezione precedente, senza ripeterla.' : 'Apri presentando brevemente il percorso.'}
          ${n < cur.parts.length - 1 ? `Chiudi con una frase che anticipa la prossima lezione: "${cur.parts[n + 1].title}".` : 'Chiudi tirando le fila di tutto il percorso.'}`,
            };
          }

          async function writeLesson(plan) {
            let best = null;
            for (let attempt = 1; attempt <= 3; attempt++) {
              let draft;
              try {
                const { text } = await gemini({
                  schema: LESSON_SCHEMA,
                  temperature: 0.8,
                  system: 'Sei un divulgatore italiano eccellente, nello stile dei migliori saggisti: chiaro, preciso, narrativo, mai banale. Scrivi in italiano. Niente emoji, niente elenchi puntati nel corpo del testo.',
                  prompt: `Scrivi una lezione di microlearning.
          Categoria: ${plan.category}
          Argomento: ${plan.topic}
          Angolazione: ${plan.angle}
          ${plan.fromNews ? `Lo spunto è questa notizia della settimana: "${plan.fromNews.headline}". Richiamala in apertura in una frase, poi spiega il concetto in modo che resti valido anche quando la notizia sarà dimenticata.\n` : ''}${plan.context ? `${plan.context}\n` : ''}
          STRUTTURA:
          - "title": titolo evocativo e chiaro, max 10 parole.
          - "hook": 1-2 frasi che incuriosiscono e pongono la domanda centrale.
          - "sections": 3 o 4 sezioni con "heading" breve e "body" di 1-3 paragrafi separati da una riga vuota. Parti dall'intuizione, poi spiega il meccanismo, poi le implicazioni. Puoi usare **grassetto** per i termini chiave.
          - "example": un esempio concreto o un caso reale (60-100 parole).
          - "keyTakeaways": esattamente 3 frasi da ricordare.
          - "funFact": una curiosità vera e verificabile (max 50 parole).
          - "furtherReading": 1-2 libri o risorse reali e esistenti, con "note" di una riga.

          VINCOLI:
          - Lunghezza totale tra 850 e 1100 parole: deve leggersi in 5 minuti.
          - Accuratezza assoluta: se un dato è incerto, non citarlo.`,
                });
                draft = parseJSON(text);
              } catch (err) {
                log(`Lezione: tentativo ${attempt} non valido (${err.message})`);
                continue;
              }
              const sections = arr(draft.sections).map((s) => ({ heading: str(s.heading), body: str(s.body) })).filter((s) => s.heading && s.body);
              if (!str(draft.title) || sections.length < 2) { log(`Lezione: tentativo ${attempt} incompleto`); continue; }
              const lesson = {
                date: today,
                generatedAt: new Date().toISOString(),
                model: MODEL,
                kind: plan.kind,
                category: plan.category,
                categoryId: plan.categoryId,
                ...(plan.series ? { series: plan.series } : {}),
                ...(plan.fromNews ? { fromNews: plan.fromNews } : {}),
                title: str(draft.title),
                hook: str(draft.hook),
                sections,
                example: str(draft.example),
                keyTakeaways: arr(draft.keyTakeaways).map(str).filter(Boolean).slice(0, 3),
                funFact: str(draft.funFact),
                furtherReading: arr(draft.furtherReading).map((f) => (typeof f === 'string' ? { title: f } : { title: str(f.title), note: str(f.note) })).filter((f) => f.title).slice(0, 2),
              };
              const total = words([lesson.hook, ...sections.flatMap((s) => [s.heading, s.body]), lesson.example, ...lesson.keyTakeaways, lesson.funFact].join(' '));
              lesson.minutes = Math.max(1, Math.round(total / WPM));
              lesson.words = total;
              log(`Lezione: ${total} parole (tentativo ${attempt})`);
              const fits = total >= LIMITS.lesson.min && total <= LIMITS.lesson.max;
              if (fits) return lesson;
              if (!best || Math.abs(total - 950) < Math.abs(best.words - 950)) best = lesson;
            }
            if (best) { log('Lezione: uso la versione più vicina alla lunghezza richiesta'); return best; }
            throw new Error('Gemini non ha prodotto una lezione valida dopo 3 tentativi');
          }

          async function generateLesson() {
            const topicsPath = path.join(DATA, 'topics.json');
            let topics = await readJSON(topicsPath, null);
            if (!arr(topics?.categories).length) {
              topics = { updatedAt: today, categories: DEFAULT_TOPICS.map((name) => ({ id: slug(name), name, enabled: true })) };
              await writeJSON(topicsPath, topics);
              note('Creato data/topics.json con le categorie predefinite');
            }

            const indexPath = path.join(DATA, 'lessons', 'index.json');
            const lessonPath = path.join(DATA, 'lessons', `${today}.json`);
            const seriesPath = path.join(DATA, 'series.json');
            const idx = await readJSON(indexPath, { lessons: [] });
            idx.lessons = arr(idx.lessons);
            const series = await readJSON(seriesPath, { current: null, history: [] });
            series.history = arr(series.history);

            if (existsSync(lessonPath)) {
              if (!FORCE) { note('Lezione di oggi già presente: nessuna modifica'); return; }
              // Rigenerazione: se oggi era una puntata di un percorso, la stessa puntata viene riscritta
              const old = await readJSON(lessonPath, {});
              if (old.series) {
                if (series.current?.id === old.series.id) series.current.done = old.series.part - 1;
                else if (series.history.at(-1)?.id === old.series.id && series.history.at(-1).endedAt === today) {
                  const h = series.history.pop();
                  series.current = { ...h.plan, done: old.series.part - 1 };
                }
              }
            }

            const others = idx.lessons.filter((l) => l.date !== today);
            let plan = null;
            if (IS_SUNDAY && !NEW_SERIES) plan = await planFromNews(others).catch((err) => { log(`Lezione dall'attualità non riuscita (${err.message})`); return null; });
            if (!plan) plan = await planSeries(topics, others, series);
            if (!plan) plan = await planRegular(topics, others);
            log(`Lezione: "${plan.topic}" (${plan.category})`);

            const lesson = await writeLesson(plan);
            await writeJSON(lessonPath, lesson);
            idx.lessons = [
              {
                date: today, title: lesson.title, category: lesson.category, categoryId: lesson.categoryId,
                minutes: lesson.minutes, hook: lesson.hook, kind: lesson.kind,
                ...(lesson.series ? { series: { id: lesson.series.id, title: lesson.series.title, part: lesson.series.part, total: lesson.series.total } } : {}),
              },
              ...others,
            ].sort((a, b) => b.date.localeCompare(a.date));
            await writeJSON(indexPath, idx);

            if (plan.kind === 'series') {
              const cur = series.current;
              cur.done += 1;
              if (cur.done >= cur.parts.length) {
                const { done, ...planCopy } = cur;
                series.history.push({ id: cur.id, title: cur.title, startedAt: cur.startedAt, endedAt: today, plan: planCopy });
                series.current = null;
              }
            }
            await writeJSON(seriesPath, series);
            note(`Lezione: "${lesson.title}" (${lesson.kind === 'series' ? `percorso "${lesson.series.title}", parte ${lesson.series.part} di ${lesson.series.total}` : lesson.category}, ${lesson.minutes} minuti)`);

          }

          /* ===================== QUOTIDIE ENGLISH — INIZIO =====================
             5 parole inglesi B2/C1 al giorno + audio della pronuncia britannica.
             Scrive data/english/AAAA-MM-GG.json, data/english/index.json
             e data/audio/en-AAAA-MM-GG-N.mp3 (conservati 30 giorni).
             Usa dal generatore: gemini(), parseJSON(), readJSON(), writeJSON(), log(),
             note(), today, DATA, path, existsSync, readdir, unlink, mkdir, writeFile,
             e gli import qdEnSpawn / qdEnRm (vedi istruzioni).
             ===================================================================== */
          const EN = {
            dir: path.join(DATA, 'english'),
            audioDir: path.join(DATA, 'audio'),
            voice: (process.env.EDGE_VOICE_EN || '').trim() || 'en-GB-RyanNeural',
            level: (process.env.ENGLISH_LEVEL || '').trim() || 'B2/C1',
            keepAudioDays: 30,
            // Ogni giorno: 2 inglese colto, 2 business, 1 phrasal verb o idioma
            plan: ['general', 'general', 'business', 'business', 'phrasal'],
          };
          const EN_CATEGORY_LABEL = { general: 'Inglese colto', business: 'Business e lavoro', phrasal: 'Phrasal verb e idiomi' };

          const EN_SCHEMA = {
            type: 'object',
            properties: {
              words: {
                type: 'array',
                items: {
                  type: 'object',
                  properties: {
                    word: { type: 'string' },
                    category: { type: 'string', enum: ['general', 'business', 'phrasal'] },
                    ipa: { type: 'string' },
                    partOfSpeech: { type: 'string' },
                    level: { type: 'string', enum: ['B2', 'C1'] },
                    register: { type: 'string', enum: ['formale', 'neutro', 'informale'] },
                    meaningIt: { type: 'string' },
                    definitionEn: { type: 'string' },
                    examples: { type: 'array', items: { type: 'string' } },
                    exampleIt: { type: 'string' },
                    synonyms: { type: 'array', items: { type: 'string' } },
                    collocations: { type: 'array', items: { type: 'string' } },
                    commonMistake: { type: 'string' },
                    cloze: { type: 'string' },
                  },
                  required: ['word', 'category', 'ipa', 'partOfSpeech', 'level', 'register', 'meaningIt', 'definitionEn', 'examples', 'exampleIt', 'synonyms', 'collocations', 'commonMistake', 'cloze'],
                },
              },
            },
            required: ['words'],
          };

          const enKey = (w) => String(w).toLowerCase().replace(/[^a-z' -]/g, '').replace(/\s+/g, ' ').trim();

          function validateEnglish(draft, seen) {
            const list = Array.isArray(draft?.words) ? draft.words : [];
            const out = [];
            const used = new Set();
            for (const raw of list) {
              const w = {
                word: String(raw.word || '').trim(),
                category: ['general', 'business', 'phrasal'].includes(raw.category) ? raw.category : null,
                ipa: String(raw.ipa || '').trim().replace(/^\/?/, '/').replace(/\/?$/, '/'),
                partOfSpeech: String(raw.partOfSpeech || '').trim(),
                level: raw.level === 'C1' ? 'C1' : 'B2',
                register: ['formale', 'neutro', 'informale'].includes(raw.register) ? raw.register : 'neutro',
                meaningIt: String(raw.meaningIt || '').trim(),
                definitionEn: String(raw.definitionEn || '').trim(),
                examples: (Array.isArray(raw.examples) ? raw.examples : []).map((s) => String(s).trim()).filter(Boolean).slice(0, 2),
                exampleIt: String(raw.exampleIt || '').trim(),
                synonyms: (Array.isArray(raw.synonyms) ? raw.synonyms : []).map((s) => String(s).trim()).filter(Boolean).slice(0, 4),
                collocations: (Array.isArray(raw.collocations) ? raw.collocations : []).map((s) => String(s).trim()).filter(Boolean).slice(0, 3),
                commonMistake: String(raw.commonMistake || '').trim(),
                cloze: String(raw.cloze || '').trim().replace(/_{2,}/g, '____'),
              };
              const k = enKey(w.word);
              if (!w.word || !w.category || !w.meaningIt || !w.definitionEn || w.examples.length < 1) continue;
              if (!w.cloze.includes('____')) continue;
              if (w.cloze.toLowerCase().includes(w.word.toLowerCase())) continue; // la risposta non deve comparire nella frase
              if (seen.has(k) || used.has(k)) continue;
              used.add(k);
              out.push(w);
            }
            return out;
          }

          async function generateEnglish() {
            const file = path.join(EN.dir, `${today}.json`);
            if (existsSync(file)) { note('Inglese: parole di oggi già presenti'); return; }

            const idxPath = path.join(EN.dir, 'index.json');
            const idx = await readJSON(idxPath, { days: [] });
            idx.days = Array.isArray(idx.days) ? idx.days : [];
            const seen = new Set(idx.days.flatMap((d) => (d.words || []).map(enKey)));
            const recent = idx.days.slice(0, 400).flatMap((d) => d.words || []);

            let words = [];
            for (let attempt = 1; attempt <= 3 && words.length < 5; attempt++) {
              const need = EN.plan.slice(0);
              for (const w of words) need.splice(need.indexOf(w.category), 1);
              try {
                const { text } = await gemini({
                  schema: EN_SCHEMA,
                  temperature: 0.9,
                  system: 'Sei un insegnante madrelingua di inglese britannico che prepara studenti italiani adulti al livello C1. Scegli parole utili e frequenti nell\'inglese autentico di oggi, mai arcaiche o troppo rare.',
                  prompt: `Prepara ${need.length} parole o espressioni inglesi nuove di livello ${EN.level} per un professionista italiano.
          Categorie richieste, una voce per ciascuna, in quest'ordine: ${need.join(', ')}.
          - general = vocabolario colto di uso generale (giornali, conversazione colta)
          - business = lavoro, riunioni, email, negoziazione, finanza
          - phrasal = un phrasal verb o un'espressione idiomatica di uso comune

          Per ogni voce:
          - "word": la parola o espressione (forma base);
          - "ipa": trascrizione fonetica IPA britannica (Received Pronunciation) tra barre;
          - "partOfSpeech": in inglese (noun, verb, adjective, adverb, phrasal verb, idiom...);
          - "level": B2 o C1; "register": formale, neutro o informale;
          - "meaningIt": significato in italiano, chiaro e breve (max 15 parole);
          - "definitionEn": definizione in inglese semplice (max 20 parole);
          - "examples": 2 frasi d'esempio naturali e moderne, di contesti diversi;
          - "exampleIt": traduzione italiana della prima frase d'esempio;
          - "synonyms": 2-3 sinonimi o espressioni vicine;
          - "collocations": 2-3 combinazioni tipiche (es. "meticulous attention to detail");
          - "commonMistake": un errore tipico degli italiani con questa parola (falso amico, preposizione, pronuncia), in italiano, max 25 parole;
          - "cloze": una frase NUOVA, diversa dagli esempi, in cui la parola è sostituita da ____ (quattro trattini bassi) e che si completa solo con quella parola.

          NON usare nessuna di queste voci già studiate: ${recent.join(', ') || '(nessuna)'}.`,
                });
                const valid = validateEnglish(parseJSON(text), new Set([...seen, ...words.map((w) => enKey(w.word))]));
                // Rispetta il piano delle categorie
                for (const w of valid) {
                  const i = need.indexOf(w.category);
                  if (i >= 0 && words.length < 5) { words.push(w); need.splice(i, 1); }
                }
                log(`Inglese: ${words.length}/5 parole valide (tentativo ${attempt})`);
              } catch (err) {
                log(`Inglese: tentativo ${attempt} non riuscito (${err.message})`);
              }
            }
            if (words.length < 3) throw new Error('Gemini non ha prodotto abbastanza parole inglesi valide');
            words.sort((a, b) => EN.plan.indexOf(a.category) - EN.plan.indexOf(b.category));
            words = words.map((w, i) => ({ id: `${today}-${i + 1}`, ...w, categoryLabel: EN_CATEGORY_LABEL[w.category] }));

            // Audio della pronuncia: parola + primo esempio
            await mkdir(EN.audioDir, { recursive: true });
            let audioOk = 0;
            for (let i = 0; i < words.length; i++) {
              const w = words[i];
              const name = `en-${today}-${i + 1}.mp3`;
              try {
                await enTts(`${w.word}. ... ${w.examples[0]}`, path.join(EN.audioDir, name));
                w.audio = `data/audio/${name}`;
                audioOk++;
              } catch (err) {
                log(`Inglese: audio di "${w.word}" non riuscito (${err.message})`);
              }
            }

            await writeJSON(file, { date: today, level: EN.level, voice: EN.voice, generatedAt: new Date().toISOString(), words });
            idx.days = [{ date: today, words: words.map((w) => w.word), levels: words.map((w) => w.level) }, ...idx.days.filter((d) => d.date !== today)]
              .sort((a, b) => b.date.localeCompare(a.date));
            idx.updatedAt = new Date().toISOString();
            await writeJSON(idxPath, idx);
            await cleanupEnglishAudio();
            note(`Inglese: ${words.map((w) => w.word).join(', ')} (audio ${audioOk}/${words.length})`);
          }

          function enTts(text, dest) {
            return new Promise((resolve, reject) => {
              const tmp = `${dest}.txt`;
              writeFile(tmp, text, 'utf8').then(() => {
                const child = qdEnSpawn('edge-tts', ['--voice', EN.voice, '--rate=-8%', '-f', tmp, '--write-media', dest], { stdio: ['ignore', 'ignore', 'pipe'] });
                let err = '';
                const timer = setTimeout(() => child.kill('SIGKILL'), 60000);
                child.stderr.on('data', (d) => { err += d; });
                child.on('error', (e) => { clearTimeout(timer); qdEnRm(tmp, { force: true }).finally(() => reject(e)); });
                child.on('close', (code) => {
                  clearTimeout(timer);
                  qdEnRm(tmp, { force: true }).finally(() => (code === 0 && existsSync(dest) ? resolve() : reject(new Error(err.slice(-200) || `codice ${code}`))));
                });
              }, reject);
            });
          }

          async function cleanupEnglishAudio() {
            if (!existsSync(EN.audioDir)) return;
            const limit = new Date(`${today}T12:00:00Z`);
            limit.setUTCDate(limit.getUTCDate() - EN.keepAudioDays);
            const cutoff = limit.toISOString().slice(0, 10);
            for (const f of await readdir(EN.audioDir)) {
              const m = /^en-(\d{4}-\d{2}-\d{2})-\d+\.mp3$/.exec(f);
              if (m && m[1] < cutoff) await unlink(path.join(EN.audioDir, f)).catch(() => {});
            }
          }
          /* ===================== QUOTIDIE ENGLISH — FINE ===================== */

          /* ---------- Main ---------- */
          async function main() {
            log(`Edizione del ${today} (${SCHEDULED ? 'automatica' : 'manuale'})`);
            let failed = false;

            if (process.env.AUDIO_ONLY === 'only') {
              try { if (!(await generateAudioForToday())) failed = true; } catch (err) { failed = true; note(`Errore audio: ${err.message}`); }
              try { await cleanupOldAudio(); } catch {}
              if (process.env.GITHUB_STEP_SUMMARY) await appendFile(process.env.GITHUB_STEP_SUMMARY, `### Audio\n\n${report.map((l) => `- ${l}`).join('\n')}\n`);
              if (failed) process.exit(1);
              return;
            }

            if (!ONLY || ONLY === 'news') {
              try {
                const latest = await readJSON(path.join(DATA, 'news', 'latest.json'), null);
                // Il secondo orario programmato non rifà il lavoro se il primo è andato a buon fine
                if (SCHEDULED && latest?.date === today) {
                  note('Giornale di oggi già presente: nessuna modifica');
                } else {
                  await saveNews(await generateNews());
                }
              } catch (err) {
                failed = true;
                note(`Errore nel giornale: ${err.message}`);
              }
            }

            if (!ONLY || ONLY === 'lesson') {
              try {
                await generateLesson();
              } catch (err) {
                failed = true;
                note(`Errore nella lezione: ${err.message}`);
              }
            }

            if (!ONLY || ONLY === 'tutto') {
              try {
                await generateEnglish();
              } catch (err) {
                failed = true;
                note(`Errore inglese: ${err.message}`);
              }
            }

            if (process.env.AUDIO_ONLY !== 'skip' && (!ONLY || process.env.AUDIO_ONLY === 'only')) {
              try {
                if (!(await generateAudioForToday())) failed = true;
              } catch (err) {
                failed = true;
                note(`Errore audio: ${err.message}`);
              }
            }

            try {
              await cleanupOldAudio();
            } catch (err) {
              log('Errore pulizia vecchi audio:', err.message);
            }

            if (process.env.GITHUB_STEP_SUMMARY) {
              await appendFile(process.env.GITHUB_STEP_SUMMARY, `### Edizione di ${longDate(today)}\n\nModello: ${MODEL}\n\n${report.map((l) => `- ${l}`).join('\n')}\n`);
            }
            if (failed) process.exit(1);
          }

          main();
          GENERATOR

      - name: Genera notizie e lezione
        id: gen
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          EVENT: ${{ github.event_name }}
          ONLY: ${{ inputs.only || github.event.client_payload.only }}
          FORCE: ${{ inputs.force || github.event.client_payload.force }}
          NEW_SERIES: ${{ inputs.new_series || github.event.client_payload.new_series }}
          AUDIO_ONLY: skip
        run: node "$RUNNER_TEMP/gen/generate.mjs"

      - name: Salva i contenuti nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d data ]; then echo "Nessun contenuto generato"; exit 0; fi
          git add data
          if git diff --staged --quiet; then
            echo "Nessun contenuto nuovo"
            exit 0
          fi
          git commit -m "Edizione del $(TZ=Europe/Rome date +%F)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "Push non riuscito, nuovo tentativo tra 10 secondi"
            sleep 10
          done
          exit 1

      - name: Genera l'audio
        id: audio
        continue-on-error: true
        timeout-minutes: 90
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          EVENT: ${{ github.event_name }}
          ONLY: ${{ inputs.only || github.event.client_payload.only }}
          AUDIO_ONLY: only
          AUDIO_ENGINE: ${{ vars.AUDIO_ENGINE }}
          TEST_OPEN_SOURCE: ${{ inputs.test_open_source || github.event.client_payload.test_open_source }}
          QWEN_BIN: ${{ steps.qwen-check.outputs.bin }}
          QWEN_MODEL_DIR: ${{ steps.qwen-check.outputs.model }}
          QWEN_SPEAKER: ${{ vars.QWEN_SPEAKER }}
          QWEN_SPEAKER_LESSON: ${{ vars.QWEN_SPEAKER_LESSON }}
          EDGE_VOICE: ${{ vars.EDGE_VOICE }}
          AUDIO_BITRATE: ${{ vars.AUDIO_BITRATE }}
        run: |
          git pull --rebase || true
          node "$RUNNER_TEMP/gen/generate.mjs"

      - name: Salva l'audio nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d data/audio ]; then echo "Nessun audio generato"; exit 0; fi
          git add data/audio
          if git diff --staged --quiet; then
            echo "Nessun audio nuovo"
            exit 0
          fi
          git commit -m "Audio del $(TZ=Europe/Rome date +%F)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "Push non riuscito, nuovo tentativo tra 10 secondi"
            sleep 10
          done
          exit 1

      - name: Segnala errori di generazione
        if: steps.gen.outcome == 'failure' || steps.audio.outcome == 'failure'
        run: |
          if [ "${{ steps.gen.outcome }}" = "failure" ]; then
            echo "::error::La generazione dei contenuti non è riuscita: apri lo step 'Genera notizie e lezione' per il dettaglio."
            exit 1
          fi
          if [ "${{ steps.audio.outcome }}" = "failure" ]; then
            echo "::warning::Alcuni file audio non sono stati completati: verranno completati alla successiva esecuzione programmata."
          fi
